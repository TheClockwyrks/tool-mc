[package]
name = "test-cabinet-mc-skin"
description = "The mc-skin binary a run image carries to build a skinned marching-cubes character."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The `mc-skin` binary: the Marching Cubes skinned-character tool (low-poly surface
# character). It pins the marching-cubes algorithm and delegates the whole command
# surface to `test-cabinet-model-skin` (the shared skinning CLI — the skeleton binding,
# skin weighting, and skinned-`.glb` encode). The Surface Nets / Dual Contouring
# siblings are `sn-skin` / `dc-skin`. See
# <https://docs.testcabinet.ai/testing/asset-generation/skinned-binaries/>.
[[bin]]
name = "mc-skin"
path = "src/main.rs"

[dependencies]
# The shared skinning library, with its `cli` feature (the whole command
# surface and the renderer stack).
test-cabinet-model-skin = { workspace = true, features = ["cli"] }

[lints]
workspace = true
